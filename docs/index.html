<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>我们的点滴</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-card">
      <p class="kicker">小范围预览</p>
      <h1>我们的点滴</h1>
      <p class="gate-desc">把聊天摘录、照片、视频和电子信收成一条故事线。内容只存在你自己的浏览器里，不会上传到服务器。</p>
      <input id="gate-input" class="input" type="password" placeholder="访问口令" autocomplete="off" />
      <button id="gate-btn" class="btn primary" type="button">进入</button>
      <p id="gate-error" class="error hidden">口令不对</p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="top">
      <div>
        <h1 id="page-title">故事</h1>
        <p id="page-sub" class="sub">记录两个人的点点滴滴</p>
      </div>
    </header>
    <main id="main"></main>
    <nav class="tabbar">
      <button data-tab="story" class="tab on" type="button">故事</button>
      <button data-tab="add" class="tab" type="button">记下</button>
      <button data-tab="mine" class="tab" type="button">我们</button>
    </nav>
  </div>
  <script src="./app.js"></script>
</body>
</html>
