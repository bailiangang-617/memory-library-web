<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>给紫钦</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="./styles.css?v=20260912b" />
</head>
<body>
  <div id="folio" class="folio hidden" aria-hidden="true">
    <div class="folio-leaf left"></div>
    <div class="folio-leaf right"></div>
  </div>
  <div id="backdrop" class="backdrop hidden" aria-hidden="true">
    <img id="backdrop-img" alt="" />
  </div>
  <div id="gate" class="gate">
    <div class="gate-card">
      <p class="kicker">写给紫钦</p>
      <div class="flourish" aria-hidden="true"><span></span></div>
      <h1>贺紫钦</h1>
      <p class="gate-desc">从你递来的第一张照片起，到分别时那句说不完的不舍。把我们走过的路，轻轻放在这里。</p>
      <input id="gate-input" class="input" type="password" placeholder="只有我们知道的口令" autocomplete="off" />
      <button id="gate-btn" class="btn primary" type="button">翻开</button>
      <p id="gate-error" class="error hidden">口令不对</p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="top">
      <div>
        <h1 id="page-title">贺紫钦</h1>
        <p id="page-sub" class="sub">与你的日子</p>
      </div>
    </header>
    <main id="main"></main>
    <nav class="tabbar">
      <button data-tab="add" class="tab" type="button">写下</button>
    </nav>
  </div>
  <div id="sheet" class="sheet hidden"></div>
  <div id="cropper" class="cropper hidden"></div>
  <audio id="bgm" src="./bgm-zi.mp3?v=20260912b" loop preload="auto"></audio>
  <button id="bgm-btn" class="bgm-btn hidden" type="button" title="Peter Eastman · Love Theme（CC BY 3.0）" aria-label="背景音乐 Love Theme">♪</button>
  <script src="./cloud-config.js?v=20260912b"></script>
  <script src="./cloud.js?v=20260912b"></script>
  <script src="./app.js?v=20260912b"></script>
</body>
</html>
